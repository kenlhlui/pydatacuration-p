# User-facing text for pydatacuration (English).
#
# - Change wording here, not in the Python code. The code refers to each message by its dotted key,
#   e.g. t('setup.form_reset').
# - Keep {placeholders} as they are; the code fills them in.
# - Messages with "one" and "other" forms are picked by a count: "1 file found", "3 files found".
# - Quote every value, so YAML doesn't read words such as No or Off as true/false.
# - Log messages are not in this file; they stay in the code, in English.
# - To add a language, copy this file (e.g. to fr.yaml) and translate the values, keeping the keys.

