# Automated check results, keyed by check ID. Keep the IDs: they are stored with each project's results.
#   name, description: shown above the results.
#   unit: stored in the database with each result.
#   found: the count line shown above the results.
checks:
  missing_required_fields:
    name: "Missing Required Metadata Fields"
    description: "Required metadata fields that are empty or missing"
    unit: "field"
    found:
      one: "{count} field found"
      other: "{count} fields found"
  authors_missing_affiliation:
    name: "Author affiliation field"
    description: "Authors missing institutional affiliation information"
    unit: "author"
    found:
      one: "{count} author found"
      other: "{count} authors found"
  authors_missing_identifier:
    name: "Author Research ID field"
    description: "Authors missing personal identifier (ORCID, etc.)"
    unit: "author"
    found:
      one: "{count} author found"
      other: "{count} authors found"
  authors_missing_scheme:
    name: "Authors Research Identifier Scheme"
    description: "Authors missing identifier scheme information"
    unit: "author"
    found:
      one: "{count} author found"
      other: "{count} authors found"
  related_datasets_entries:
    name: "Related Datasets"
    description: "Check if related datasets are present in the dataset metadata"
    unit: "related dataset"
    found:
      one: "{count} related dataset found"
      other: "{count} related datasets found"
  data_sources_entries:
    name: "Data Sources"
    description: "Check if data sources are present in the dataset metadata"
    unit: "data source"
    found:
      one: "{count} data source found"
      other: "{count} data sources found"
  related_publications_entries:
    name: "Related Publications"
    description: "Check if related publications are present in the dataset"
    unit: "publication"
    found:
      one: "{count} publication found"
      other: "{count} publications found"
  keywords_existence:
    name: "Keywords"
    description: "Check if keywords are present in the dataset"
    unit: "keyword"
    found:
      one: "{count} keyword found"
      other: "{count} keywords found"
  license:
    name: "License of the Dataset"
    description: "License information in the dataset"
    unit: "license"
    found:
      one: "{count} license found"
      other: "{count} licenses found"
  termsOfAccess:
    name: "Terms of Access of the Dataset"
    description: "Terms of Access information in the dataset"
    unit: "term of access"
    found:
      one: "{count} term of access found"
      other: "{count} terms of access found"
  termsOfUse:
    name: "Terms of Use of the Dataset"
    description: "Terms of Use information in the dataset"
    unit: "terms of use"
    found:
      one: "{count} terms of use found"
      other: "{count} terms of use found"
  restricted_files:
    name: "Restricted file names"
    description: "files with access restrictions in the dataset"
    unit: "file"
    found:
      one: "{count} file found"
      other: "{count} files found"
  filename_special_chars:
    name: "File names with Special Characters"
    description: "Files containing special characters in filename"
    unit: "file"
    found:
      one: "{count} file found"
      other: "{count} files found"
  missing_file_extensions:
    name: "File names missing extensions"
    description: "Files without proper file extensions"
    unit: "file"
    found:
      one: "{count} file found"
      other: "{count} files found"
  readme_files:
    name: "File names for README"
    description: "README files detected in the dataset"
    unit: "file"
    found:
      one: "{count} file found"
      other: "{count} files found"
  depositor_history:
    name: "Depositor history"
    description: "Previous datasets depositor in this Dataverse collection"
    unit: "depositor record"
    found:
      one: "{count} depositor record found"
      other: "{count} depositor records found"
    # One line per earlier dataset; stored with the results when the checks run.
    entry: "{depositor}: {dataset_name} ({dataset_url}) - Dataverse Name: {dataverse_name}"
  potential_typos:
    name: "Fields for Title, Subtitle, Alternative Title, Description, and Notes"
    description: "Fields for Title, Subtitle, Alternative Title, Description, and Notes"
    unit: "typo"
    found:
      one: "{count} typo found"
      other: "{count} typos found"
  uncommon_file_formats:
    name: "Files with uncommon formats"
    description: "Files using uncommon or proprietary file formats"
    unit: "file"
    found:
      one: "{count} file found"
      other: "{count} files found"
  file_openability:
    name: "File openability report"
    description: "Files that cannot be opened or read by the validation tool"
    unit: "file"
    found:
      one: "{count} file found"
      other: "{count} files found"
  unsupported_files:
    name: "Unsupported file formats report"
    description: "Files in formats not supported by the validation tool"
    unit: "file"
    found:
      one: "{count} file found"
      other: "{count} files found"
