---
checklist:
  - id: "1.1"
    action: |
      **History of previous deposits**: Has the person submitting the dataset had previous curation reviews, or have they deposited other datasets in U of T Dataverse?
    instructions: |
      - An automated check will display if the person who submitted for review has gone through the curation review process before with any other dataset
        - Can do a spot check on the tracking sheet to get an overview of the types of deposit issues that have occurred in previous deposits
      - Refer to ‘Dataset Path’ in the dataset information box (above), if the dataset is part of a collection that indicates a research group, can also spot check previous deposits on the curation review tracking sheet 
      - Should also double-check with the curation certification list to ensure we catch any errors between lists
      - TEMPORARY: Right now a secondary automated check will display any other datasets which have the person who submitted for review listed as a ‘Depositor’. This is to try to give an understanding of how much experience they may have with Borealis in lieu of curation review history
        - Note that the ‘Depositor’ field can be manually changed and that the ‘Depositor’
        - The person who creates the deposit is not always the same person who populates the metadata, files, etc
      - Consider information from the automated check, just situating information that may be helpful to know ahead of review, rather than a comprehensive understanding of the person’s deposit experience
    priority: "info"
    section: "1. Structure of deposit"
    automated_check_ids: ["depositor_history"]
    curator_check_item: "Author metadata, dataverse collection history"
    check_type: "Fully-automated"

  - id: "1.2"
    action: "**Collection structure**: If the dataset is deposited in a collection, does the collection structure seem appropriate?"
    instructions: |
      - Review the collection name
        - Is it descriptive and appropriate for the datasets contained within? (e.g research group, project)
        - Is it the same name as the dataset?
      - If the depositor created a dataverse with one dataset, confirm that they actually require a dataverse (e.g. will there be future deposits?) or if it should move to the institutional collection 
      - Check if the dataset appears related to other datasets in the collection 
      - Mark ‘Not Applicable’ if dataset deposited directly in institutional collection
        - Can also spot check dataset relationship field to see if there appears to be another dataset or collection that should be considered for this deposit
      - Automated check will display any dataset (and dataset path) for any of the authors on the dataset being reviewed
        - Note that there is no author disambiguation
        - Datasets listed may have different authorship structures - may consider looking at keywords, titles, or common authors across datasets to find outputs that might be related

    priority: "info"
    section: "1. Structure of deposit"
    curator_check_item: |
      - Collection name
      - Collection structure
      - Dataset relationships
    check_type: "Manual"

  - id: "2.1"
    action: "**File integrity**:  Do the files open properly?"
    instructions: |
      - All files will be programmatically tested and files that open successfully will not be listed in automated check
      - ‘Cannot_be_opened’: notes an error in opening supported file types - check issue manually
        - Copy list into curator notes
        - Test opening files, note any error message that may be helpful to understanding the issue in curator notes
      - ‘Type_not_supported: notes files that cannot be opened programmatically
        - Manually open a minimum of 5 of each file type if we have the program and note any opening errors (include file extension and include at least one example file name)
        - Note any file extensions that were not checked (e.g. “File type: .bin was not reviewed”)
    priority: "required"
    section: "2. Files"
    automated_check_ids: ["file_accessibility", "unsupported_files"]
    curator_check_item: |
      - Opening errors
      - Files flagged by the tool check
    check_type: "Semi-automated"

  - id: "2.2"
    action: "**Special characters**: Do file names include special characters? i.e. >:\"/\\|?*,@$~)"
    instructions: |
      - Review special character inclusion, note any issues that may cause errors in opening or compiling 
      - Note that some of these errors would be caught in 2.1 (special characters may be the reason behind a file opening error, e.g. ~ for .doc files)
    priority: "recommended"
    section: "2. Files"
    automated_check_ids: ["filename_special_chars"]
    # curator_check_item: "Filename special characters report"
    check_type: "Fully-automated"

  - id: "2.3"
    action: "**Common file formats**: Are all files in common formats?"
    instructions: |
      - Automated check will identify files with uncommon formats
        - As per common file formats list
      - Note any uncommon formats that may benefit from an additional open format file format (if appropriate)
        - E.g. a `.wpd` file may benefit from an additional file in `.pdf` format for preservation purposes
      - For any files with uncommon formats, check if the deposit provides any information or software needed to open or work with the file
        - Check Metadata fields:
          - In the ‘Metadata’ tab, ‘Software’:
            - ‘Name’
            - ‘Version’
          - Can also check ‘Description’ or ‘Notes’
        - Check README or data documentation files
      - Note comments may be more appropriate in other curation items:
        - For metadata fields, include suggestions in <u>4.5</u>
        - For README, include suggestions in <u>3.2</u>
        - For data documentation, include suggestions in <u>3.3</u>
    priority: "required"
    section: "2. Files"
    automated_check_ids: ["missing_file_extensions"]
    # curator_check_item: "Missing file extensions report"
    check_type: "Semi-automated"

  - id: "2.4"
    action: "**File extensions**: Do all the file names contain the file extension?"
    instructions: |
      - Automated check will identify files that are missing an extension. 
      - Files names in the file list should appear with the extension:
          - Correct: “04_requirements.txt“
          - Missing: “04_requirements”
      - Exception: 
          - READMEs do not require a file extension (e.g. a README file can either be 'README' or 'README.md' or “README.txt” and does not bear comment)
      - For other flagged files researcher should clarify extension, curator needs to check on a case-by-case basis
    priority: "info"
    section: "2. Files"
    automated_check_ids: ["uncommon_file_formats"]
    curator_check_item: |
      - Files flagged by the tool check
    check_type: "Fully-automated"

  - id: "3.1"
    action: "**README file existence**: Does the dataset include a separate README file?"
    instructions: |
      - This review is for READMEs for the deposit; data documentation for specific data files will be reviewed in <u>3.3</u>
      - Tool will identify any files with the string ‘README’ (not case sensitive)
      - If no README is identified in automated check, review file list to see if there is a file with README contents under a different name (e.g. ‘read me.txt’, ‘data_info.doc’, ‘39u570.pdf’) or files tagged as documentation that may have README content
      - Curator may suggest renaming README unless it appears to be a disciplinary practice to name otherwise
      - Curator may suggest or add the ‘Documentation’ tag to relevant file(s)

    priority: "required"
    section: "3. Documentation"
    automated_check_ids: ["readme_files"]
    curator_check_item: "Files that may contain README information"
    check_type: "Semi-automated"

  - id: "3.2"
    action: "**README file content**: Does the README file contain accurate and complete information about the files and their organization?"
    instructions: |
      - Review recommended README fields are present, Curator to determine if/what suggestions are important for the specific deposit
        - Authors
        - License
        - Dataset information and DOI
        - File information
          - Check whether the files listed in the README match the files listed in the deposit.
          - If the files are not listed in the README, Curator can copy the tree structure text (inside ds_tree.txt) from the curation log folder and provide it to the depositors for inclusion in their README, if applicable
        - <a href="https://guides.library.utoronto.ca/ld.php?content_id=37666730" target="_blank">Any other relevant information</a> needed to navigate/use files that is not included in other data documentation (cross check with <u>3.3</u> review)
    priority: "required"
    section: "3. Documentation"
    curator_check_item: |
      - Files flagged by the automated or manual review in <u>3.1</u>
    check_type: "Semi-automated"

  - id: "3.3"
    action: "**Data file documentation**: Is there additional documentation for data files?"
    instructions: |
      - Check if information needed to understand and use data files (e.g. variables, definitions, etc.) is included in at least one of the following:
        - README as defined in 3.1/3.2
        - Data documentation files (e.g. codebook, data dictionary, etc.)
        - Contained in the data file itself (e.g. inside a worksheet of an Excel file)
      - Curator to determine if any suggestions to enhance data documentation bear comment
        - Data should be documented to facilitate verification and reuse

    priority: "required"
    section: "3. Documentation"
    curator_check_item: |
      - README files, documentation files, and file contents
    check_type: "Manual"

  - id: "4.1"
    action: "**Typos in metadata fields**: Do any metadata fields contain typos?"
    instructions: |
      - Automated check will identify potentially misspelled words (excluding words that are capitalized)
      - Note that the tool check might flag some fields incorrectly (such as acronyms/specialized terms). Delete the items from the list accordingly.
      - Curator should also note any apparent incorrect words (e.g. ‘their’ instead of ‘there’)
      - Curator may use judgment to modify obvious errors directly in the system (e.g. ‘Unicorn of Toronto’ instead of ‘University of Toronto’ as affiliation)

    priority: "required"
    section: "4. Metadata"
    automated_check_ids: ["potential_typos"]
    curator_check_item: |
      - Files flagged by the tool check
      - Fields for:
        - Title
        - Subtitle
        - Alternative Title
        - Description
        -Notes

    check_type: "Semi-automated"

  - id: "4.2"
    action: "**Valid metadata entries**: Do the metadata fields have valid entries?"
    instructions: |
      - Review metadata fields noted to ensure complete and relevant information is contained  
        - Examples of items to flag:
          - Placeholders (e.g. TBD, coming soon, etc.)
          - Incorrectly filled data (e.g. placing the author's name in the title)
          - Blank entries
          - Missing information (e.g. no affiliation listed)

    priority: "required"
    section: "4. Metadata"
    curator_check_item: |
      - Fields for:
        - Title
        - Description
        - Subject
        - Author name & affiliation
    check_type: "Manual"

  - id: "4.3"
    action: "**Author affiliation**: Is at least one author affiliated with the University of Toronto?"
    instructions: |
      - Tool will check that either ‘uoft’, ‘u of t’ or ‘university of toronto’ is contained in the Author Affiliation field (non-case sensitive)
      - Also review any description to see if research is noted as under an organization other than U of T (e.g. description says ‘project for UHN’)

    priority: "required"
    section: "4. Metadata"
    automated_check_ids: ["authors_missing_affiliation"]
    # curator_check_item: "Authors missing affiliation report"
    check_type: "Fully-automated"

  - id: "4.4"
    action: "**Researcher ID**: Does the dataset list a ‘Researcher ID’ for each author?"
    instructions: |
      - Automated check will display missing identifiers in the ‘Author Affiliation’ field.  
      - If flagged as missing, Curator should suggest adding Researcher ID(s), such as ORCID, or other identifiers if available. 
        - This ensures their research data is properly credited, increases discoverability of their research output, and consolidates their research metrics.

    priority: "recommended"
    section: "4. Metadata"
    automated_check_ids:
      ["authors_missing_identifier", "authors_missing_scheme"]
    curator_check_item: |
      - Inclusion of Researcher ID(s) if flagged in tool check
    check_type: "Fully-automated"

  - id: "4.5"
    action: "**Metadata opportunities**: Should any information contained in the deposit be captured in a metadata field?"
    instructions: |
      - Review the description and README file and identify information that could be included in a metadata field. For example:
        - e.g. if a geographical location or data collection date/range is mentioned in the description, can suggest population ‘geographic coverage’ metadata fields
        - If the README indicates the software, can suggest adding to metadata fields for ‘software name’ and ‘version’
      - Curator to determine appropriateness and volume of suggestions
      - For reference on available metadata options, consult:
        - <a href="https://zenodo.org/records/5668945" target="_blank">Dataverse North Metadata Best Practices (PDF)</a>
        - <a href="https://docs.google.com/spreadsheets/d/1XA9ImwdvN-LvZJDAq_mh4jzLXWfg6fD6/edit?usp=sharing&ouid=101747471886352747956&rtpof=true&sd=true" target="_blank">Borealis Metadata Fields UofT MDL (xlsx)</a>

    priority: "recommended"
    section: "4. Metadata"
    curator_check_item: |
      - Description
      - README file
      - Metadata field mappings
    check_type: "Manual"

  - id: "4.6"
    action: "**Acronyms and discipline or domain-specific terminology**: Have all terms and acronyms been clearly defined?"
    instructions: |
      - Review the metadata and flag any acronyms, abbreviations, or domain-specific terminology that might benefit from additional description
        - Curator should take into account disciplinary norms or common acronyms that may be understood in the field and do bear comment (e.g. VHS does not need to be defined as Video Home System)
      - Focus should be on the ‘Title’ and ‘Description’ of the dataset
    priority: "recommended"
    section: "4. Metadata"
    curator_check_item: |
      - Metadata fields
      - Acronyms and abbreviations 
      - Discipline or domain-specific terminology
    check_type: "Manual"

  - id: "4.7"
    action: "**Dataset description**: Is the dataset description comprehensive and informative?"
    instructions: |
      - Evaluate whether the description includes key details relevant for the discipline, data type(s), and/or research method, such as:
        - Overview of the method of analysis
        - Overview of files and types of data
        - Data processing tools used
        - Relevant characteristics of the data, such as:
          - Dates of collection
          - Geographical location
          - Experimental conditions
          - etc.
        - Other dataset(s) used in creating the dataset
        - Other relevant information
      - Recommendations should be limited to information needed to understand the data as appropriate for the field of research
      - Curator may wish to check related publications to ensure description is suitable for the dataset and not just the article abstract (unless appropriate for dataset description)
    priority: "recommended"
    section: "4. Metadata"
    curator_check_item: |
      - Dataset description field
    check_type: "Manual"

  - id: "4.8"
    action: "**Keywords**: Are appropriate keywords included with the dataset?"
    instructions: |
      - If keywords are present, Curator checks:
        - Formatting (e.g. one keyword per entry, spaces between words, etc.)
        - Appropriate choice for the dataset description and contents (e.g. ‘acoustic emission sensor’ and ‘physics’, instead of just ‘physics’)
      - If keywords are absent or limited, Curator recommends:
        - Addition of keywords or suggest keyword terms for review
        - Any relevant controlled vocabularies/ontologies that may be useful for term generation
      - Curator may also check related publication keywords if in a disciplinary index (e.g. INSPEC, PubMed, etc.)
    priority: "recommended"
    section: "4. Metadata"
    automated_check_ids: ["keywords_existence"]
    curator_check_item: |
      - Keywords field
      - Controlled vocabulary/ontology from the relevant subject domain (if appropriate)

    check_type: "Semi-automated"

  - id: "4.9"
    action: "**Related Publication**: Is this dataset linked to a publication, or does the title/description indicate that the dataset is replication, background, or supporting data for a publication?"
    instructions: |
      - If the publication is listed in ‘Related Publication’ field:
        - Is the appropriate citation information present (e.g. title, author, date, link/PID)
        - Does the link or persistent identifier work and link to the correct publication
        - If multiple publications, ensure each citation is separate and not in one long text string 
          - Note: must check ‘Citation Metadata’ under ‘Metadata’ tab for multiple publications as only first publication listed on landing page; check above for all
      - If no publication is listed in the ‘Related Publication’ field:
        - Check if the dataset title or description indicates related publication(s), if yes:
          - Suggest adding citation(s) to the ‘Related Publication’ field
          - If it indicates the dataset is replication data for a specific publication suggest adding appropriate suffix
      - If a suffix such as replication, background, or supporting data is used in the dataset title:
        - Ensure there is a citation in the ‘Related Publication’ field and that the publication title and dataset title (after suffix) match, for example:
        - Publication title: Temperature measurements in Lake Superior
        - Dataset title: Replication data for: Temperature measurements in Lake Superior

    priority: "recommended"
    section: "4. Metadata"
    curator_check_item: |
      - Related Publication field
      - DOI/PID references
      - Title/Description fields
    check_type: "Manual"

  - id: "4.10"
    action: "**Related Dataset**:  Is this dataset linked to other datasets, or does the title/description indicate that the dataset is related to other datasets?"
    instructions: |
      - ‘Related Dataset’ field should be used for linkages to related data outputs or projects, both within or external to Borealis
        - Note that third party data used in project should be linked in ‘Data Source’ (see 4.11)
      - If there is a dataset listed in ‘Related Dataset’ field:
        - Is the appropriate citation information present (e.g. title, author, date, link/PID)
        - Does the link or persistent identifier work and link to the correct dataset
        - If multiple datasets, ensure each citation is separate and not in one long text string 
          - Note: must check ‘Citation Metadata’ under ‘Metadata’ tab for multiple related datasets as only first dataset listed on landing page; check above for all
      - If there is not a dataset listed in ‘Related Dataset; field:
        - Briefly review the dataset title, description, notes, and documentation to determine if there are any obvious related datasets that should be included
    priority: "recommended"
    section: "4. Metadata"
    curator_check_item: |
      - Related Dataset field
      - Title
      - Description field
      - Notes field
      - Dataset documentation
    check_type: "Manual"

  - id: "4.11"
    action: "**Data Sources**: Is the dataset is comprised of, or includes, data from other sources?"
    instructions: |
      - Briefly review the dataset title, description, notes, and documentation to determine if any third party datasets were used in creating the data
      - Check if all relevant citations are included in ‘Data Source’ field in ‘Citation Metadata’ under ‘Metadata’ tab
        - Is the appropriate citation information present (e.g. title, author, date, link/PID)
        - Does the link or persistent identifier work and link to the correct dataset
        - If multiple sources, ensure each citation is separate and not in one long text string 
      - Note that this information should also be included in the ‘Description’ field (see 4.7)
    priority: "required"
    section: "4. Metadata"
    curator_check_item: |
      - Data Source field
      - Title
      - Description field
      - Notes field
      - Dataset documentation
    check_type: "Manual"

  - id: "5.1"
    action: "Does the dataset contain any obvious sensitivity issues, such as direct identifiers?"
    instructions: |
      - Review documentation and file names and see if there are any that should be opened and reviewed (e.g. if a file is named “participant survey” - maybe open that one)
      - Review description, notes, and terms of access metadata fields.
        - Examples of direct identifier include:
            - Canadian Social Insurance Number (SINs)
            - Credit card numbers
            - Email addresses
            - Phone numbers
            - vCards (Virtual Contact Files)
            - Any other information that can be used to identify an individual.
    priority: "required"
    section: "5.0 Sensitive data and IP"
    curator_check_item: "File names, documentation, metadata description/notes/access fields"
    check_type: "Manual"

  - id: "5.2"
    action: "If something is flagged in the sensitive data review, does the depositor have REB approval to share the dataset?"
    instructions: |
      - If something is flagged in the sensitive data review (see question above), check the intake form to confirm information about their REB status.
    priority: "required"
    section: "5.0 Sensitive data and IP"
    curator_check_item: "Intake form, REB approval documentation"
    check_type: "Manual"

  - id: "5.3"
    action: "Has the depositor assigned an appropriate license to the dataset?"
    instructions: |
      - If the dataset uses CC0 - confirm this is what the depositor wants
      - Check if the deposit includes restricted files (if yes, recommend they use custom terms)
    priority: "required"
    section: "5.0 Sensitive data and IP"
    automated_check_ids: ["termsOfUse", "license"]
    curator_check_item: "License field, CC0 confirmation, restricted files list"
    check_type: "Semi-automated"

  - id: "5.4b"
    action: "Is the Terms of Access field complete if there are restricted files in the dataset?"
    instructions: |
      - If there are restricted files and no Terms of Access, recommend including terms of access.
      - If there are Terms of Access, review to ensure they are clear.
    priority: "required"
    section: "5.0 Sensitive data and IP"
    automated_check_ids: ["restricted_files", "termsOfAccess"]
    curator_check_item: "Terms of Access field, restricted files status"
    check_type: "Semi-automated"

  - id: "5.5"
    action: "Is the dataset free of any obvious licensing and IP issues?"
    instructions: |
      - Review the description, documentation, and names of files to see if there are any that stand out as possible third-party data sources.
    priority: "required"
    section: "5.0 Sensitive data and IP"
    curator_check_item: "Description, documentation, file names for third-party sources"
    check_type: "Manual"

  - id: "6.1"
    action: "Additional comments or observations (required)"
    instructions: |
      - Review the description, documentation, and names of files to see if there are any that stand out as possible third-party data sources.
    priority: "required"
    section: "6.0 Additional comments"
    curator_check_item: "General review of all components"
    check_type: "Manual"

  - id: "6.2"
    action: "Additional comments or observations  (recommended)"
    instructions: |
      - Review the description, documentation, and names of files to see if there are any that stand out as possible third-party data sources.
    priority: "recommended"
    section: "6.0 Additional comments"
    curator_check_item: "General review of all components"
    check_type: "Manual"
