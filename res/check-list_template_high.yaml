---
checklist:
  - id: "1.1"
    action: "Has the depositor (or their research group) previously created or submitted to a dataverse collection ?"
    instructions: |
      - Confirm whether the listed dataverse collection refers to the same researcher/author
    priority: "info"
    section: "1. Structure of deposit"
    automated_check_ids: ["author_dataverse_history"]
    information_location: "Author metadata, dataverse collection history"
    check_type: "Fully-automated"

  - id: "1.2"
    action: "If the dataset was deposited in a sub-dataverse collection, does it require its own dataverse collection?"
    instructions: |
      If the depositor created a dataverse with one dataset:

      - Confirm whether the dataset is related to other datasets in the same sub-collection.
      - Is there another sub-dataverse collection it should be in?
      - Review collection name - is it the same name as the dataset? Is it a research group? 
      - Confirm with the depositor that they actually require a dataverse (e.g., will there be future deposits?)

    priority: "info"
    section: "1. Structure of deposit"
    information_location: "Dataverse collection structure, dataset relationships"
    check_type: "Manual"

  - id: "2.1"
    action: "Do all the files open properly?"
    instructions: |
      - For files that cannot be opened programmatically – if we have the program, open a minimum of 5 of each type of file.
    priority: "required"
    section: "2. Files"
    automated_check_ids: ["file_accessibility", "unsupported_files"]
    information: |
      - If the file cannot be opened, flag it for the depositor to check.
      - If the file is not supported, flag it for the depositor to check.
    information_location: "File accessibility report, unsupported files list"
    check_type: "Semi-automated"

  - id: "2.2"
    action: "Are all files free of the following special characters (<>:\\\"/\\|?*,@$~)?"
    instructions: null
    priority: "recommended"
    section: "2. Files"
    automated_check_ids: ["filename_special_chars"]
    information_location: "Filename special characters report"
    check_type: "Fully-automated"

  - id: "2.3"
    action: "Do all the files contain file extensions?"
    instructions: |
      - Not all the files require a file extension (e.g. a README file can either be 'README' or 'README.md'). Curator needs to check on a case-by-case basis.
    priority: "required"
    section: "2. Files"
    automated_check_ids: ["missing_file_extensions"]
    information_location: "Missing file extensions report"
    check_type: "Semi-automated"

  - id: "2.4"
    action: "Do all files appear on the common file format list?"
    instructions: "Python scripted."
    priority: "info"
    section: "2. Files"
    automated_check_ids: ["uncommon_file_formats"]
    information_location: "Uncommon file formats report"
    check_type: "Fully-automated"

  - id: "3.1"
    action: "Does the dataset include a separate README file?"
    instructions: |
      - Read the `ds_tree.txt` file in the log_files folder to identify whether there is a README file, even if it is not named with 'README'.
    priority: "required"
    section: "3. Documentation"
    automated_check_ids: ["readme_files"]
    information_location: "README files report, ds_tree.txt"
    check_type: "Fully-automated"

  - id: "3.2"
    action: "Does the README file contain correct and complete information about ‘Files and organization’?"
    instructions: |
      - Check whether the files listed in the README match the files listed in the deposit.
      - If the files are not listed in the README, we can generate a file tree structure & pass it to the depositors to include in their README, if applicable.
    priority: "required"
    section: "3. Documentation"
    information_location: "README file, file tree structure comparison"
    check_type: "Semi-automated"

  - id: "3.3"
    action: "Is there documentation for data files?"
    instructions: |
      Review README, documentation, and data files, to see if there is anything explaining variable headings etc.
    priority: "required"
    section: "3. Documentation"
    information_location: "README file, data file headers, documentation files"
    check_type: "Manual"

  - id: "4.1"
    action: "Are there any typos in metadata fields?"
    instructions: |
      Note that the automated process might flag wrongly (such as acronyms/specialized terms. Delete the items from the list accordingly.
    priority: "required"
    section: "4. Metadata"
    automated_check_ids: ["potential_typos"]
    information_location: |
      Only checking the following fields:

      1. Title
      2. Subtitle
      3. Alternative Title
      4. Description
      5. Notes
    check_type: "Semi-automated"

  - id: "4.2"
    action: "Do the metadata fields contain a valid entry?"
    instructions: |
      Note: Valid info means the information is relevant. Examples of items to flag:
      Placeholders (Coming soon, etc.)
      Wong filed (e.g. put author's name in the title)

    priority: "required"
    section: "4. Metadata"
    information_location: |
      Review the following fields to ensure there is a valid entry and flag any issues:

      1. Title
      2. Description
      3. Subject
      4. Author name & affiliation
    check_type: "Manual"

  - id: "4.3"
    action: "Does at least one author affiliated with University of Toronto?"
    instructions: |
      - This will check either ‘uoft’, ‘u of t’ or ‘university of toronto’ is filled for the author affiliation (non-case sensitive)

    priority: "required"
    section: "4. Metadata"
    automated_check_ids: ["authors_missing_affiliation"]
    information_location: "Authors missing affiliation report"
    check_type: "Fully-automated"

  - id: "4.4"
    action: "Does the dataset include a Researcher ID for each author?"
    instructions: |
      If no Researcher ID (such as ORCID, or other identifier) is listed, let them know they may want to include it

    priority: "recommended"
    section: "4. Metadata"
    automated_check_ids:
      ["authors_missing_identifier", "authors_missing_scheme"]
    information_location: "Author metadata, researcher ID fields"
    check_type: "Fully-automated"

  - id: "4.5"
    action: "Can any part of the deposit content be represented in a metadata field?"
    instructions: |
      - Read the description and README file and check them against metadata fields. For example, if a geographical location or data collection date/range is mentioned in the description, recommend filling in the relevant metadata fields

      - You may reference the following documents to view the available metadata blocks:
         - [Dataverse North Metadata Best Practices (PDF)](https://zenodo.org/records/5668945)
         - [Borealis Metadata Fields UofT MDL (xlsx)](https://docs.google.com/spreadsheets/d/1XA9ImwdvN-LvZJDAq_mh4jzLXWfg6fD6/edit?usp=sharing&ouid=101747471886352747956&rtpof=true&sd=true)

    priority: "recommended"
    section: "4. Metadata"
    information_location: "Description, README file, metadata field mappings"
    check_type: "Manual"

  - id: "4.6"
    action: "Are all terms and acronyms defined?"
    instructions: |
      Review metadata and flag acronyms/terms that may need to be described.
    priority: "recommended"
    section: "4. Metadata"
    information_location: "Metadata fields, acronyms and terms usage"
    check_type: "Manual"

  - id: "4.7"
    action: "Does the dataset description provide sufficient information?"
    instructions: |
      Still need to discover/formulate the best practices for writing dataset descriptions.

      Some elements to look for may include:

      - Dates of collection
      - Geographical location
      - Type of data
      - Other dataset(s) used in creating the dataset
      - Overview of the method of analysis
      - Data processing tools used
      - Other relevant information
    priority: "recommended"
    section: "4. Metadata"
    information_location: "Dataset description field"
    check_type: "Manual"

  - id: "4.8"
    action: "Does the dataset include keywords?"
    instructions: |
      - If no/few keywords are included, recommend including some.
      - Can also provide information about controlled vocabulary (in that specific field) if none is filled out.
    priority: "recommended"
    section: "4. Metadata"
    automated_check_ids: ["keywords_existence"]
    information_location: "Keywords field, controlled vocabulary references"
    check_type: "Fully-automated"

  - id: "4.9"
    action: "Does the dataset serve as Replication, Background, or Supporting data for a publication?"
    instructions: |
      - If a suffix is used or the title suggests a publication, check the metadata for an associated publication.
      - If metadata indicates a related publication or project:
        - Suggest adding a corresponding suffix to the title. 
        - Check whether a PID (such as a DOI) is included.
    priority: "recommended"
    section: "4. Metadata"
    information_location: "Title, metadata publication fields, DOI/PID references"
    check_type: "Manual"

  - id: "4.10"
    action: "Any related dataset?"
    instructions: |
      - Does the title, description or notes indicate there is a related dataset that should be included in the metadata?
    priority: "recommended"
    section: "4. Metadata"
    information_location: "Title, description, notes fields for related datasets"
    check_type: "Manual"

  - id: "5.1"
    action: "Does the dataset contain any obvious sensitivity issues, such as direct identifiers?"
    instructions: |
      - Review documentation and file names and see if there are any that should be opened and reviewed (e.g. if a file is named “participant survey” - maybe open that one)
      - Review description, notes, and terms of access metadata fields.
        - Examples of direct identifier include:
            - Canadian Social Insurance Number (SINs)
            - Credit card numbers
            - Email addresses
            - Phone numbers
            - vCards (Virtual Contact Files)
            - Any other information that can be used to identify an individual.
    priority: "required"
    section: "5.0 Sensitive data and IP"
    information_location: "File names, documentation, metadata description/notes/access fields"
    check_type: "Manual"

  - id: "5.2"
    action: "If something is flagged in the sensitive data review, does the depositor have REB approval to share the dataset?"
    instructions: |
      - If something is flagged in the sensitive data review (see question above), check the intake form to confirm information about their REB status.
    priority: "required"
    section: "5.0 Sensitive data and IP"
    information_location: "Intake form, REB approval documentation"
    check_type: "Manual"

  - id: "5.3"
    action: "Has the depositor assigned an appropriate license to the dataset?"
    instructions: |
      - If the dataset uses CC0 - confirm this is what the depositor wants
      - Check if the deposit includes restricted files (if yes, recommend they use custom terms)
    priority: "required"
    section: "5.0 Sensitive data and IP"
    automated_check_ids: ["termsOfUse", "license"]
    information_location: "License field, CC0 confirmation, restricted files list"
    check_type: "Semi-automated"

  - id: "5.4b"
    action: "Is the Terms of Access field complete if there are restricted files in the dataset?"
    instructions: |
      - If there are restricted files and no Terms of Access, recommend including terms of access.
      - If there are Terms of Access, review to ensure they are clear.
    priority: "required"
    section: "5.0 Sensitive data and IP"
    automated_check_ids: ["restricted_files", "termsOfAccess"]
    information_location: "Terms of Access field, restricted files status"
    check_type: "Semi-automated"

  - id: "5.5"
    action: "Is the dataset free of any obvious licensing and IP issues?"
    instructions: |
      - Review the description, documentation, and names of files to see if there are any that stand out as possible third-party data sources.
    priority: "required"
    section: "5.0 Sensitive data and IP"
    information_location: "Description, documentation, file names for third-party sources"
    check_type: "Manual"

  - id: "6.1"
    action: "Additional comments or observations (required)"
    instructions: |
      - Review the description, documentation, and names of files to see if there are any that stand out as possible third-party data sources.
    priority: "required"
    section: "6.0 Additional comments"
    information_location: "General review of all components"
    check_type: "Manual"

  - id: "6.2"
    action: "Additional comments or observations  (recommended)"
    instructions: |
      - Review the description, documentation, and names of files to see if there are any that stand out as possible third-party data sources.
    priority: "recommended"
    section: "6.0 Additional comments"
    information_location: "General review of all components"
    check_type: "Manual"
