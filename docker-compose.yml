services:
  data-curation-tool:
    build: .
    image: data-curation-tool:latest
    ports:
      - "9005:80"
    env_file:
      - .env
    environment:
      - DOTENV_PATH=/app/.env
      - MAIN_DIR=/data/workdir  # Override to point to mounted directory
    volumes:
      - ./workdir:/data/workdir  # Mount local workdir to /data/workdir in container
    restart: unless-stopped