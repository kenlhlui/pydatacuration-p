services:
  data-curation-tool:
    build: .
    image: data-curation-tool:latest
    container_name: data-curation-tool
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "9005:8080"
    env_file:
      - ./.env  # Configure the path to your .env file if it's located elsewhere
    volumes:
      - ./new_dir:/app/workdir  # Configure the path on the left side of colon to your desired host directory
      - ./res:/app/res  # Configure the path for the res directory
    restart: unless-stopped

  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: cloudbeaver
    # user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "8978:8978"
    environment:
      - CB_ADMIN_NAME=cbadmin
      - CB_ADMIN_PASSWORD=changeme  # Change this to a secure password
    volumes:
      - cloudbeaver_data:/opt/cloudbeaver/workspace
      - ./new_dir/db:/data/db:ro  # Mount the db directory instead of the file directly
    restart: unless-stopped

volumes:
  cloudbeaver_data: