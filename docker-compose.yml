services:
  data-curation-tool:
    build: .
    image: data-curation-tool:latest
    container_name: data-curation-tool
    user: "${USER_ID:-1000}:${GROUP_ID:-1000}"
    ports:
      - "9005:8000"
    env_file:
      - ./.env   # Your .env file
    volumes:
      - ./new_dir:/workdir
    restart: unless-stopped
