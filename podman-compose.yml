services:
  data-curation-tool:
    build: .
    image: data-curation-tool:latest
    container_name: data-curation-tool
    userns_mode: keep-id
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "9005:8000"
    env_file:
      - ./.env
    volumes:
      - ./new_dir:/app/workdir:Z,U
    restart: unless-stopped