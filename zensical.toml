[project]
site_url = "https://kenlhlui.github.io/pydatacuration-p/"
site_name = "U of T Dataverse dataset curation tool"
site_description = "A dataset curation tool for Dataverse repositories, with a web interface."
site_author = "Ken Lui"

copyright = "Copyright &copy; 2026 Ken Lui"

repo_url = "https://github.com/kenlhlui/pydatacuration-p"
repo_name = "kenlhlui/pydatacuration-p"
# edit_uri = "edit/main/docs/"

nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    { "Local setup (uv)" = "local_setup/README.md" },
    { "Container (Docker)" = "container/README.md" },
  ] },
  { "Configuration" = [
    { "App settings" = "app_settings/README.md" },
    { "Custom status options" = "custom_status_options/README.md" },
    { "Checklist" = "checklist/README.md" },
  ] },
  { "Development" = [
    { "Database schema version" = "db_schema_version/README.md" },
    { "Bump the version" = "version_bump/README.md" },
  ] },
]

extra_css = ["stylesheets/extra.css"]
# extra_javascript = ["javascripts/extra.js"]

[project.theme]
# variant = "classic"
# custom_dir = "overrides"
# favicon = "images/favicon.png"
language = "en"
features = [
  "announce.dismiss",
  # "Copy as Markdown" button; needs the llmstxt plugin below
  "content.action.copy",
  # "content.action.edit",
  # "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  # "header.autohide",
  # "navigation.expand",
  "navigation.footer",
  # Off: it would turn each section's first README.md page into the section heading
  # "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  # "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  "navigation.sections",
  # "navigation.tabs",
  # "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  # "toc.follow",
  # "toc.integrate",
]

# logo = "assets/logo.png"

# [project.theme.icon]
# logo = "lucide/smile"

# [project.theme.font]
# text = "Inter"
# code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# [[project.extra.social]]
# icon = "fontawesome/brands/github"
# link = "https://github.com/user/repo"

# [[project.extra.social]]
# icon = "fontawesome/brands/mastodon"
# link = "https://fosstodon.org/@user"

# Base URL for links to repo files outside docs/, used in Markdown as {{ repo_blob }}
[project.extra]
repo_blob = "https://github.com/kenlhlui/pydatacuration-p/blob/main"

# Replaces {{ ... }} variables in Markdown during the build
[project.plugins.markdownextradata]

# Lets docs/index.md pull in the repo README with {% include-markdown "../README.md" %}
[project.plugins.include-markdown]

# Builds llms.txt plus a Markdown copy of each page, used by "content.action.copy"
[project.plugins.llmstxt.sections]
"Documentation" = ["*.md"]

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
# Renders GitHub callouts (> [!NOTE], > [!TIP], ...) as admonitions
pymdownx.quotes.callouts = true
pymdownx.smartsymbols = {}
# pymdownx.snippets.base_path = "includes"
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
