[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
# General settings
line-length = 120
indent-width = 4
ignore = ["T201"]  # Ignore print statements globally

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
# Enable pycodestyle (`E`) and Pyflakes (`F`) codes by default.
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "W",   # pycodestyle warnings
    "C90", # mccabe
    "I",   # isort
    "N",   # pep8-naming
    "D",   # pydocstring
    "UP",  # pyupgrade
    "ANN", # flake8-annotations
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "EM",  # flake8-errmsg
    "G",   # flake8-logging-format
    "PIE", # flake8-pie
    "T20", # flake8-print
    "Q",   # flake8-quotes
    "RSE", # flake8-raise
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib
    "PL",  # Pylint
]
ignore = ["RET504", "T201", "W505", "G004"]  # Ignore 'unnecessary-assign (RET504) rule'; 'Print (T201)'; W505 "doc-line-too-long"; G004 "logging-f-string"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
force-single-line = true
lines-after-imports = 2
known-first-party = ["my_package"]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "single"

[tool.ruff.lint.pylint]
max-args = 6  # Google suggests keeping functions focused
max-locals = 15
max-statements = 50

[tool.ruff.lint.mccabe]
max-complexity = 10  # Google suggests keeping functions simple

[tool.ruff.lint.per-file-ignores]
# Ignore some rules in tests
"test_*.py" = ["D", "ANN"]
# Ignore some rules in __init__.py files
"__init__.py" = ["F401"]
# Ignore long line warnings in main.py
"dvmeta/main.py" = ["E501"]

[tool.ruff.lint.pep8-naming]
# Google style guide naming conventions
classmethod-decorators = ["classmethod"]
staticmethod-decorators = ["staticmethod"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 120
