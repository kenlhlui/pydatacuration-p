[project]
name = "pydatacuration"
version = "0.1.0"
description = ""
authors = [{ name = "Ken Lui" }]
requires-python = "==3.12.12"
readme = "README.md"
license = "MIT"
dependencies = [
    "pyyaml>=6.0.2,<7",
    "pandas[excel]>=2.2.3,<3",
    "orjson>=3.10.7,<4",
    "python-dotenv>=1.0.1,<2",
    "deepdiff>=8.0.1,<9",
    "jinja2>=3.1.4,<4",
    "jmespath>=1.0.1,<2",
    "pyspellchecker>=0.8.1,<0.9",
    "pillow>=11.0.0,<13",
    "netcdf4>=1.7.2,<2",
    "chardet>=5.2.0,<6",
    "openpyxl>=3.1.5,<4",
    "pyreadstat>=1.2.8,<2",
    "pyreadr>=0.5.2,<0.6",
    "ffmpeg-python>=0.2.0,<0.3",
    "seedir>=0.5.0,<0.6",
    "pyshp>=2.3.1,<3",
    "pypdf>=5.1.0,<7",
    "python-docx>=1.1.2,<2",
    "docxtpl>=0.19.1,<0.21",
    "trogon>=0.6.0,<0.7",
    "httpx>=0.28.1",
    "tenacity>=9.1.2,<10",
    "py7zr>=1.1.0,!=1.1.2",
    "uvicorn>=0.35.0",
    "python-multipart>=0.0.20",
    "html2docx>=1.6.0",
    "loguru>=0.7.3",
    "duckdb>=1.3.2",
    "sqlmodel>=0.0.24",
    "duckdb-engine>=0.17.0",
    "deptry>=0.23.1",
    "nicegui==3.8.0",
    "html-sanitizer>=2.6.0",
    "typer==0.21.1",
    "pydantic>=2",
    "psycopg[binary]>=3.3.3",
]

[dependency-groups]
dev = [
    "coverage>=7.13.0",
    "ipykernel>=6.29.5,<8",
    "pytest>=9.0.2",
]

[tool.uv]
package = false
constraint-dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
# General settings
line-length = 120
indent-width = 4

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
# Enable pycodestyle (`E`) and Pyflakes (`F`) codes by default.
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "W",   # pycodestyle warnings
    "C90", # mccabe
    "I",   # isort
    "N",   # pep8-naming
    "D",   # pydocstring
    "UP",  # pyupgrade
    "ANN", # flake8-annotations
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "EM",  # flake8-errmsg
    "G",   # flake8-logging-format
    "PIE", # flake8-pie
    "T20", # flake8-print
    "Q",   # flake8-quotes
    "RSE", # flake8-raise
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib
    "PL",  # Pylint
]
ignore = ["RET504", "T201", "W505", "G004"]  # Ignore 'unnecessary-assign (RET504) rule'; 'Print (T201)'; W505 "doc-line-too-long"; G004 "logging-f-string"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
force-single-line = true
lines-after-imports = 2
known-first-party = ["pydatacuration"]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "single"

[tool.ruff.lint.pylint]
max-args = 6  # Google suggests keeping functions focused
max-locals = 15
max-statements = 50

[tool.ruff.lint.mccabe]
max-complexity = 10  # Google suggests keeping functions simple

[tool.ruff.lint.per-file-ignores]
# Ignore some rules in tests
"test_*.py" = ["D", "ANN"]
# Ignore some rules in __init__.py files
"__init__.py" = ["F401"]
# Ignore long line warnings in main.py
"dvmeta/main.py" = ["E501"]

[tool.ruff.lint.pep8-naming]
# Google style guide naming conventions
classmethod-decorators = ["classmethod"]
staticmethod-decorators = ["staticmethod"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 120
